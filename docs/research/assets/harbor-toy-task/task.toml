schema_version = "1.4"

[task]
name = "railhead/toy-service"
version = "1.0.0"
description = "Toy: a service started at container boot (ENTRYPOINT) and a compose sidecar both stay alive through the agent and verifier phases."
keywords = ["railhead", "harbor-probe"]

[[task.authors]]
name = "Railhead Team"

[metadata]
difficulty = "easy"
category = "probe"

[verifier]
# Default environment_mode is "shared": test.sh runs in the SAME live container
# the agent used, so it can query running services.
timeout_sec = 120.0

[agent]
timeout_sec = 300.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
network_mode = "public"

# Runs inside `main` after `docker compose up --wait` and before agent setup.
# All retries must pass or the trial fails before the agent starts.
[environment.healthcheck]
command = "python -c \"import urllib.request as u; u.urlopen('http://localhost:8080/', timeout=2); u.urlopen('http://game:9000/state', timeout=2)\""
interval_sec = 1.0
start_period_sec = 10.0
start_interval_sec = 1.0
timeout_sec = 5.0
retries = 3
