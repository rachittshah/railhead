<!doctype html><html><head><meta charset="utf-8"><title>06 deal</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,400i&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
</head><body style="margin:0;background:#141513"><canvas id="c"></canvas>
<script src="lib.js"></script>
<script>
// The one paper object: a real deal from a test game (pilot v3, contract C7), rendered as a shipping form like the
// site's (site/index.html, Fig. 8), in plain words. Stamps as on the site: signed, missed, paid late.
const B = { l1: 0.05, l2: 0.85, form0: 0.1, form1: 1.0, st: [1.7, 2.35, 3.0], out0: 3.85, out1: 4.2 };
window.EVENTS = [{ name: 'l1', t: B.l1 }, { name: 'form', t: B.form0 }, ...B.st.map((t, i) => ({ name: 'stamp' + i, t }))];
const F = { x: 1100, y: 190, w: 660, h: 690 };
const ROWS = [
  ['Between', 'Company A and company B, both run by AI', false],
  ['A gets', 'The right to build on B’s land', false],
  ['A owes', '£4,000 per instalment', true],
  ['If A does not pay', 'Nothing forces it to.', false],
];
const STAMPS = [['Signed', '#2f6a45', -6, 40], ['Missed', '#b23b33', 4, 250], ['Paid late', '#73560f', -3, 440]];
scene(SCENES[5], t => {
  fill(C.ballast);
  const out = prog(t, B.out0, B.out1);
  words('They can make deals.', 116, 500, { size: 92, weight: 500, stagger: 0.07 }, t, B.l1, out);
  words('Promises cost money.', 116, 600, { size: 92, weight: 500, stagger: 0.07, color: C.signal }, t, B.l2, out);
  const k = outCubic(prog(t, B.form0, B.form1)), fo = 1 - inOutSine(out);
  if (k > 0) {
    ctx.save(); ctx.globalAlpha = k * fo;
    ctx.translate(F.x + F.w / 2, F.y + F.h / 2 + (1 - k) * 80); ctx.rotate((-1.2 + (1 - k) * 2) * Math.PI / 180); ctx.translate(-F.w / 2, -F.h / 2);
    ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 50 * S; ctx.shadowOffsetY = 24 * S;
    ctx.fillStyle = C.paper; ctx.fillRect(0, 0, F.w, F.h); ctx.shadowColor = 'transparent';
    const P = 40;
    text('Deal', P, 84, { size: 60, weight: 600, color: C.ink, track: -0.04 });
    text('No. C7', F.w - P, 80, { size: 28, mono: true, color: C.ink, align: 'right' });
    ctx.fillStyle = C.ink; ctx.fillRect(P, 106, F.w - 2 * P, 3);
    ROWS.forEach(([lab, val, mono], i) => {
      const y = 106 + i * 96;
      text(lab, P, y + 40, { size: 24, color: C.ink2, weight: 500 });
      text(val, P, y + 80, { size: mono ? 32 : 30, mono, weight: 500, color: C.ink });
      ctx.fillStyle = 'rgba(30,31,28,0.22)'; ctx.fillRect(P, y + 96, F.w - 2 * P, 2);
    });
    STAMPS.forEach(([w, col, rot, x], i) => {
      const s = prog(t, B.st[i], B.st[i] + 0.22); if (s <= 0) return;
      ctx.save(); ctx.globalAlpha = k * fo * 0.92 * outCubic(s);
      ctx.translate(P + x + 70, 568); ctx.rotate(rot * Math.PI / 180); const sc = lerp(1.3, 1, outCubic(s)); ctx.scale(sc, sc);
      font(34, 600); ctx.letterSpacing = '0.5px'; const tw = ctx.measureText(w).width;
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.strokeRect(-tw / 2 - 16, -30, tw + 32, 56);
      ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(w, 0, 10); ctx.letterSpacing = '0px';
      ctx.restore();
    });
    text('A real deal from a test game.', P, F.h - 30, { size: 24, color: C.ink2, weight: 400 });
    ctx.restore();
  }
  rail(5, t);
});
</script></body></html>
