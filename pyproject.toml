[project]
name = "railhead"
version = "0.1.0"
description = "Railhead: a frontier RL environment where models play OpenTTD directly — forkable world, metered imagination, promise-keeping rewards, replay-verified outcomes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rachitt Shah" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6"]
gym = ["gymnasium>=1.0"]
hub = ["huggingface_hub>=0.30", "pyarrow>=15"]

[project.scripts]
rh = "railhead.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/railhead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real OpenTTD binary (set RAILHEAD_OPENTTD or have it on PATH)"]
timeout = 300

[tool.ruff]
line-length = 110
target-version = "py311"
