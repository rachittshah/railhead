[project]
name = "railhead"
dynamic = ["version"]
description = "Railhead: a frontier RL environment where models play OpenTTD directly — forkable world, metered imagination, promise-keeping rewards, replay-verified outcomes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rachitt Shah" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff==0.17.4"]  # ruff pinned: its default rule set changes between releases
gym = ["gymnasium>=1.0"]
hub = ["huggingface_hub>=0.30", "pyarrow>=15"]
viz = ["matplotlib>=3.8"]

[project.scripts]
rh = "railhead.cli:main"
railhead = "railhead.admin_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/railhead/__init__.py"  # the single source of the version

[tool.hatch.build.targets.wheel]
packages = ["src/railhead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real OpenTTD binary (set RAILHEAD_OPENTTD or have it on PATH)"]
timeout = 300

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Files that other work streams are changing now (core runtime, arena tooling). Fix these findings there and
# remove the entries; until then they must not block the CI ruff step.
"src/railhead/daemon.py" = ["SIM115"]
"src/railhead/world.py" = ["PYI034"]
"src/railhead/arena_run.py" = ["SIM905", "PLW1510", "SIM115"]
