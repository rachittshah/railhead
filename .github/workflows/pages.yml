name: Pages

# Publishes site/ to GitHub Pages. The page reads media and data from assets/, which in the repository are
# symlinks to docs/ for local work; here they are replaced by real copies of the files the page uses.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/img/**"
      - "docs/video/**"
      - "docs/data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble _site
        run: |
          set -euo pipefail
          mkdir _site
          # the page, styles, scripts and small derived images; not the dev symlinks or the design notes
          rsync -a --exclude 'assets/' --exclude 'DESIGN.md' site/ _site/
          # only what the page uses (the Waybill still, one 60-second dark cut, three data files)
          mkdir -p _site/assets/img _site/assets/video _site/assets/data
          cp docs/img/waybill-pilot3-broken-promise.jpg _site/assets/img/
          cp docs/video/arena2-timelapse-dark.mp4 _site/assets/video/
          cp docs/data/arena2.json docs/data/seedgames.json docs/data/seedgames-stats.json _site/assets/data/
          # every assets/ file the page names must be in the artifact
          missing=0
          for f in $(grep -rhoE 'assets/[A-Za-z0-9_./-]+\.[a-z0-9]+' _site --include='*.html' --include='*.js' | sort -u); do
            if [ ! -f "_site/$f" ]; then echo "missing: $f"; missing=1; fi
          done
          for f in arena2.json seedgames.json seedgames-stats.json; do
            grep -q "\"$f\"" _site/js/*.js || { echo "unused data file: $f"; missing=1; }
          done
          [ "$missing" = 0 ]
          if find _site -type l | grep -q .; then echo "symlink in artifact"; exit 1; fi
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
